version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite database between container restarts
      - task_data:/app/data
    environment:
      - FLASK_ENV=production
      - DB_PATH=/app/data/tasks.db
    restart: unless-stopped

volumes:
  task_data:
